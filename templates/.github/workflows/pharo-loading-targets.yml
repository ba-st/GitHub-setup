name: Pharo Loading Targets
on:
  - push
  - pull_request
  - workflow_dispatch
jobs:
   loading-targets:
    name: ${{ matrix.load-target }}
    strategy:
      fail-fast: false
      matrix:
        load-target:
          - development
          - dependent-sunit-extensions
          - deployment
          - tests
          - tools
    uses: ./.github/workflows/pharo-loading-target.yml
    with:
      load-target: ${{ matrix.load-target }}
